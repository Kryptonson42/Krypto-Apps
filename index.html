<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinémAzard V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600;700&family=Libre+Barcode+39+Text&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #14181c; /* Gris profond Letterboxd */
        }
        
        .cinema-title {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 0.1em;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        
        .barcode {
            font-family: 'Libre Barcode 39 Text', cursive;
            font-size: 32px;
            letter-spacing: 2px;
            transform: scaleY(1.2);
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #00E054; /* Vert Letterboxd */
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .glass-panel {
            background: rgba(44, 52, 64, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        /* --- STYLES TICKET & ANIMATION --- */
        .slot-machine-container {
            position: relative;
            overflow: hidden; 
            padding-top: 20px;
            padding-bottom: 120px; 
            width: 100%;
            display: flex;
            justify-content: center;
            min-height: 600px; 
        }

        .slot-opening {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 340px;
            height: 20px;
            background: linear-gradient(to bottom, #080a0c 0%, #14181c 100%);
            border-radius: 0 0 10px 10px;
            border-bottom: 2px solid #2c3440;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            z-index: 50; 
        }

        @keyframes printTicket {
            0% { transform: translateY(-120%); }
            100% { transform: translateY(0); }
        }

        .ticket {
            display: flex;
            flex-direction: column;
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 320px;
            transform: translateY(-120%);
            z-index: 10;
        }
        
        .ticket.printing {
            animation: printTicket 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .ticket::before, .ticket::after {
            content: ''; position: absolute; top: 66%; width: 26px; height: 26px;
            background-color: #14181c; 
            border-radius: 50%; z-index: 20;
        }
        .ticket::before { left: -13px; }
        .ticket::after { right: -13px; }
        
        .perforation {
            position: absolute; top: 66%; left: 10px; right: 10px;
            border-top: 3px dashed #cbd5e1;
            z-index: 10;
        }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2399aabb%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 0.65em auto;
        }
        
        .animate-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0) scale(1); } }

        /* Animation de recherche de film */
        .searching-pulse {
            animation: pulse-border 1.5s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(0, 224, 84, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(0, 224, 84, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 224, 84, 0); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 selection:bg-green-500 selection:text-white relative">

    <!-- Widget Profil Letterboxd -->
    <div class="absolute top-4 right-4 z-50 flex items-center gap-2 bg-[#2c3440] p-1.5 md:p-2 rounded-full border border-white/10 shadow-xl transition-all duration-300 hover:border-white/30">
        <div class="w-6 h-6 md:w-8 md:h-8 rounded-full bg-[#14181c] flex items-center justify-center overflow-hidden">
            <img src="https://letterboxd.com/favicon.ico" alt="Lbx" class="w-4 h-4 md:w-5 md:h-5">
        </div>
        <input type="text" id="lbxUsername" placeholder="Pseudo Letterboxd..." class="bg-transparent text-white text-xs md:text-sm w-28 md:w-36 outline-none placeholder-slate-500 px-1" onkeypress="if(event.key === 'Enter') fetchWatchedCount()">
        <button onclick="fetchWatchedCount()" class="bg-green-600 text-white rounded-full p-1 w-6 h-6 md:w-7 md:h-7 flex items-center justify-center hover:bg-green-500 transition-colors shadow-lg" title="Actualiser le profil">
            <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
        <div id="watchedCountDisplay" class="hidden text-xs md:text-sm font-bold text-green-400 px-3 border-l border-white/20 whitespace-nowrap">
            <span id="watchedCountText">...</span> <span class="text-slate-400 font-normal text-[10px] md:text-xs uppercase tracking-wider ml-1">Films vus</span>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 pt-20 pb-32 min-h-screen flex flex-col items-center">
        
        <!-- Header -->
        <header class="flex flex-col items-center justify-center mb-8 mt-4 w-full relative">
            <!-- Logo Cliquable -->
            <div onclick="if(watchlist.length > 0) pickRandomMovies()" title="Relancer le tirage"
                 class="mb-4 rounded-full overflow-hidden w-24 h-24 shadow-lg shadow-black/50 border border-white/5 bg-[#14181c] cursor-pointer hover:scale-110 active:scale-95 transition-all duration-300 group relative">
                <img src="https://i.imgur.com/Cz0LzIT.png" alt="Logo CinémAzard" class="w-full h-full object-cover group-hover:brightness-110 transition-all">
                <div id="searchingOverlay" class="absolute inset-0 bg-black/60 flex items-center justify-center hidden rounded-full">
                    <i class="fa-solid fa-dice fa-spin text-green-500 text-2xl"></i>
                </div>
            </div>
            
            <h1 class="cinema-title text-5xl md:text-7xl font-bold bg-clip-text text-transparent mb-2 text-center"
                style="background-image: linear-gradient(to right, #FF8000, #00E054, #40BCF4);">
                CinémAzard
            </h1>
            <p class="text-slate-400 text-sm text-center">Le hasard fait bien les films</p>
        </header>

        <!-- Loader Initial -->
        <div id="initLoader" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p class="text-slate-400 text-sm animate-pulse">Chargement de la Watchlist...</p>
        </div>

        <!-- Zone de Contrôles (Menu Principal) -->
        <div id="controlsArea" class="hidden glass-panel rounded-lg p-6 md:p-8 shadow-xl mb-10 max-w-2xl w-full text-center transition-all duration-300 animate-fade-in">
            <div class="flex items-center justify-center gap-2 text-green-400 mb-6 text-xs font-small">
                <i class="fa-solid fa-check-circle"></i>
                <span id="movieCount">Liste chargée</span>
            </div>

            <div class="space-y-6 max-w-lg mx-auto">
                
                <!-- Filtres Grille -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Filtre Année -->
                    <div class="text-left bg-[#14181c] p-4 rounded-lg border border-white/5 relative group hover:border-white/20 transition-colors">
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-2"><i class="fa-regular fa-calendar mr-2"></i>Année</label>
                        <select id="yearSelect" class="w-full bg-[#2c3440] border border-[#456] text-white text-sm rounded-md p-3 cursor-pointer hover:bg-[#343e4d] transition-colors focus:ring-1 focus:ring-green-500 focus:border-green-500 outline-none">
                            <option value="all">Toutes les années</option>
                        </select>
                    </div>

                    <!-- Filtre Genre -->
                    <div class="text-left bg-[#14181c] p-4 rounded-lg border border-white/5 relative group hover:border-white/20 transition-colors">
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-2"><i class="fa-solid fa-masks-theater mr-2"></i>Genre</label>
                        <select id="genreSelect" class="w-full bg-[#2c3440] border border-[#456] text-white text-sm rounded-md p-3 cursor-pointer hover:bg-[#343e4d] transition-colors focus:ring-1 focus:ring-green-500 focus:border-green-500 outline-none">
                            <option value="all">Tous les genres</option>
                            <option value="loading" disabled>Chargement des genres...</option>
                        </select>
                    </div>
                </div>
                
                <!-- Bouton Tirage -->
                <button onclick="pickRandomMovies()" id="classicBtn"
                    class="w-full bg-gradient-to-r from-green-600 to-green-500 hover:from-green-500 hover:to-green-400 text-white font-bold py-4 px-6 rounded-xl transition-all flex items-center justify-center gap-3 shadow-lg shadow-green-900/30 transform hover:scale-105 active:scale-95 uppercase tracking-wide text-lg">
                    <span>Tirer un film au sort</span>
                    <i class="fa-solid fa-dice text-xl"></i>
                </button>
            </div>
        </div>
        
        <div id="errorMsg" class="hidden mt-4 p-4 bg-red-900/30 border border-red-500/50 rounded-lg text-red-200 text-center max-w-lg mx-auto"></div>

        <!-- Zone des Résultats -->
        <div id="resultsArea" class="hidden flex-grow flex flex-col items-center w-full">
            
            <!-- Titre "Ticket Sélectionné" -->
            <div class="text-center mb-6 z-10 relative">
                <h2 class="text-xl font-bold text-green-500 mb-1">
                    Ticket Sélectionné
                </h2>
                <p id="filterDisplay" class="text-xs text-slate-400 font-mono mb-4">Bonne séance à toi!</p>
            </div>

            <!-- MENU FILTRES & RELANCE (Vue Résultat) -->
            <div class="w-full max-w-2xl px-4 mb-8 animate-fade-in z-20 relative bg-[#1a2027] p-4 rounded-2xl border border-white/5 shadow-xl">
                <div class="flex flex-col md:flex-row gap-3">
                    <div class="flex-1 flex gap-2">
                        <select id="resultYearSelect" class="w-1/2 h-full bg-[#2c3440] hover:bg-[#343e4d] border border-[#456] text-white text-sm rounded-xl py-3 px-3 appearance-none cursor-pointer transition-colors focus:ring-1 focus:ring-green-500 outline-none truncate">
                            <option value="all">Toutes années</option>
                        </select>
                        <select id="resultGenreSelect" class="w-1/2 h-full bg-[#2c3440] hover:bg-[#343e4d] border border-[#456] text-white text-sm rounded-xl py-3 px-3 appearance-none cursor-pointer transition-colors focus:ring-1 focus:ring-green-500 outline-none truncate">
                            <option value="all">Tous genres</option>
                        </select>
                    </div>
                    <button onclick="pickRandomMovies()" class="w-full md:w-auto bg-[#2c3440] hover:bg-slate-700 text-white font-semibold py-3 px-6 rounded-xl border border-[#456] transition-all shadow-md flex justify-center items-center gap-2 whitespace-nowrap active:scale-95">
                        <i class="fa-solid fa-rotate-right"></i> Relancer
                    </button>
                </div>
            </div>

            <!-- Fente + Conteneur Ticket -->
            <div class="slot-machine-container">
                <div class="slot-opening"></div>
                <!-- Indicateur de recherche -->
                <div id="searchIndicator" class="hidden flex-col items-center mt-12 z-40">
                    <div class="loader mb-4 !border-l-blue-400 w-12 h-12 !border-[4px]"></div>
                    <p class="text-blue-300 text-sm font-mono tracking-widest uppercase animate-pulse">Recherche dans la liste...</p>
                </div>
                <!-- Grille Ticket -->
                <div id="movieGrid" class="flex justify-center w-full pt-4"></div>
            </div>

        </div>

        <!-- Footer -->
        <footer class="mt-auto pt-10 pb-4 text-center text-slate-500 text-xs w-full">
            <p>CinémAzard • Données via Letterboxd & TMDB</p>
        </footer>
    </div>

    <script>
        // CONFIGURATION
        const CURRENT_YEAR = new Date().getFullYear();
        const TMDB_API_KEY = '91ff43ba698cce948e8dd82332a6ed99';
        const CSV_FILENAME = 'watchlist.csv'; 
        const DEFAULT_USERNAME = 'TON_PSEUDO_ICI'; // <-- Insère ton pseudo Letterboxd ici entre les guillemets

        // ETAT (STATE)
        let watchlist = [];
        let tmdbGenres = []; // Stockage des genres officiels
        let currentMovieData = null; 

        // --- DEMARRAGE ---
        window.onload = function() {
            autoLoadCSV();
            fetchTMDBGenres();
            
            // Restauration du pseudo utilisateur ou utilisation du pseudo par défaut
            const savedUser = localStorage.getItem('lbxUsername') || DEFAULT_USERNAME;
            if(savedUser && savedUser !== 'TON_PSEUDO_ICI') {
                document.getElementById('lbxUsername').value = savedUser;
                fetchWatchedCount();
            }
        };

        // --- PROFIL UTILISATEUR (Compteur de films) ---
        async function fetchWatchedCount() {
            const input = document.getElementById('lbxUsername');
            const username = input.value.trim();
            if(!username) return;
            
            // Sauvegarde locale
            localStorage.setItem('lbxUsername', username);

            const display = document.getElementById('watchedCountDisplay');
            const textEl = document.getElementById('watchedCountText');
            
            display.classList.remove('hidden');
            textEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-slate-400"></i>';

            try {
                // Utilisation d'un proxy pour éviter le blocage CORS
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(`https://letterboxd.com/${username}/`)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();

                // Regex pour trouver le nombre de films dans le HTML du profil
                // On cherche le lien menant aux films avec la classe tooltip contenant le chiffre
                const regex = new RegExp(`href="/${username.toLowerCase()}/films/".*?<span class="value">([\\d,]+)</span>`, 'is');
                const match = data.contents.match(regex);

                if(match && match[1]) {
                    textEl.textContent = match[1];
                } else {
                    textEl.textContent = "N/A";
                    textEl.title = "Profil privé ou introuvable";
                }
            } catch (error) {
                console.error("Erreur profil:", error);
                textEl.textContent = "Err";
            }
        }

        // --- CHARGEMENT DES GENRES TMDB ---
        async function fetchTMDBGenres() {
            try {
                const url = `https://api.themoviedb.org/3/genre/movie/list?api_key=${TMDB_API_KEY}&language=fr-FR`;
                const res = await fetch(url);
                const data = await res.json();
                if(data.genres) {
                    tmdbGenres = data.genres;
                    populateGenreSelects();
                }
            } catch (e) {
                console.error("Impossible de charger les genres", e);
                const sel1 = document.getElementById('genreSelect');
                if(sel1) sel1.innerHTML = '<option value="all">Genres indisponibles</option>';
            }
        }

        function populateGenreSelects() {
            const selects = [document.getElementById('genreSelect'), document.getElementById('resultGenreSelect')];
            let optionsHtml = '<option value="all"> Tous les genres</option>';
            
            // Tri alphabétique des genres
            const sortedGenres = [...tmdbGenres].sort((a, b) => a.name.localeCompare(b.name));
            
            sortedGenres.forEach(g => {
                optionsHtml += `<option value="${g.id}">${g.name}</option>`;
            });

            selects.forEach(select => {
                if(select) select.innerHTML = optionsHtml;
            });
        }

        // --- CHARGEMENT WATCHLIST ---
        async function autoLoadCSV() {
            const loader = document.getElementById('initLoader');
            const controls = document.getElementById('controlsArea');
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch(CSV_FILENAME);
                if (!response.ok) throw new Error(`Impossible de trouver le fichier "${CSV_FILENAME}".`);
                
                const text = await response.text();
                parseCSV(text);
                
                loader.classList.add('hidden');
                controls.classList.remove('hidden');
                
            } catch (error) {
                console.error("Erreur chargement CSV:", error);
                loader.classList.add('hidden');
                errorMsg.innerHTML = `
                    <div class="flex flex-col items-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation text-2xl text-red-400"></i>
                        <span class="font-bold">Erreur de chargement</span>
                        <span>Impossible de lire <code>${CSV_FILENAME}</code>.</span>
                    </div>
                `;
                errorMsg.classList.remove('hidden');
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            const startIndex = lines[0].toLowerCase().includes('date') ? 1 : 0;

            for(let i = startIndex; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const parts = lines[i].split(',');
                if (parts.length < 3) continue;

                const uri = parts[parts.length - 1]?.trim();
                const yearStr = parts[parts.length - 2]?.trim();
                let title = parts.slice(1, parts.length - 2).join(',').replace(/^"|"$/g, '').trim();

                if (uri && uri.includes('boxd.it')) {
                    result.push({ Name: title, Year: parseInt(yearStr), "Letterboxd URI": uri });
                }
            }
            
            if (result.length > 0) {
                watchlist = result;
                document.getElementById('movieCount').textContent = `${result.length} films dans la liste`;
                populateYearSelect(result);
            }
        }

        function populateYearSelect(movies) {
            const uploadSelect = document.getElementById('yearSelect');
            const resultSelect = document.getElementById('resultYearSelect');
            
            const htmlOptions = '<option value="all"> Toutes les années</option>';
            const years = [...new Set(movies.map(m => m.Year))].filter(y => !isNaN(y) && y <= CURRENT_YEAR).sort((a, b) => b - a);
            
            let optionsStr = htmlOptions;
            years.forEach(year => { optionsStr += `<option value="${year}">${year}</option>`; });

            uploadSelect.innerHTML = optionsStr;
            resultSelect.innerHTML = optionsStr; 
        }

        // --- LOGIQUE DU TIRAGE AU SORT ---
        async function pickRandomMovies() {
            const isResultView = !document.getElementById('resultsArea').classList.contains('hidden');
            
            // Récupération des filtres actuels
            const yearSelectId = isResultView ? 'resultYearSelect' : 'yearSelect';
            const genreSelectId = isResultView ? 'resultGenreSelect' : 'genreSelect';
            
            const year = document.getElementById(yearSelectId).value;
            const genreId = document.getElementById(genreSelectId).value;
            
            // Synchronisation des menus déroulants
            document.getElementById('yearSelect').value = year;
            document.getElementById('resultYearSelect').value = year;
            document.getElementById('genreSelect').value = genreId;
            document.getElementById('resultGenreSelect').value = genreId;

            // Filtrage initial (Année)
            let candidates = watchlist.filter(m => (!m.Year || m.Year <= CURRENT_YEAR));
            if (year !== 'all') candidates = candidates.filter(m => m.Year == year);

            if (candidates.length === 0) { 
                alert("Aucun film trouvé pour cette année dans votre liste."); 
                return; 
            }

            // --- UI: Mode Recherche ---
            document.getElementById('controlsArea').classList.add('hidden');
            document.getElementById('resultsArea').classList.remove('hidden');
            const grid = document.getElementById('movieGrid');
            const searchIndicator = document.getElementById('searchIndicator');
            const overlay = document.getElementById('searchingOverlay');
            
            grid.innerHTML = '';
            searchIndicator.classList.remove('hidden');
            searchIndicator.classList.add('flex');
            overlay.classList.remove('hidden');

            if(window.innerWidth < 768) {
                setTimeout(() => document.getElementById('resultsArea').scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
            }

            // --- RECHERCHE DU FILM (avec vérification du Genre si demandé) ---
            // On mélange la liste pour tenter de trouver un film qui correspond au genre
            const shuffled = [...candidates].sort(() => 0.5 - Math.random());
            let foundMovie = null;
            let foundTMDBData = null;
            
            // Nombre de tentatives max pour éviter de bloquer le navigateur si le genre n'existe pas dans la liste
            const maxAttempts = Math.min(shuffled.length, 30); 

            for (let i = 0; i < maxAttempts; i++) {
                const candidate = shuffled[i];
                let searchUrl = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(candidate.Name)}&language=fr-FR&include_adult=false`;
                if (candidate.Year) searchUrl += `&year=${candidate.Year}`;

                try {
                    const res = await fetch(searchUrl);
                    const data = await res.json();
                    
                    if (data.results && data.results.length > 0) {
                        const tmdbMatch = data.results[0];
                        
                        // Si "Tous les genres" OU que le film possède l'ID du genre cherché
                        if (genreId === 'all' || (tmdbMatch.genre_ids && tmdbMatch.genre_ids.includes(parseInt(genreId)))) {
                            foundMovie = candidate;
                            foundTMDBData = tmdbMatch;
                            break; // Film trouvé ! On arrête la boucle.
                        }
                    } else if (genreId === 'all') {
                        // Fallback: Si pas de données TMDB mais aucun filtre de genre demandé, on prend le film quand même.
                        foundMovie = candidate;
                        break;
                    }
                } catch (e) {
                    console.warn("Erreur TMDB pour le film:", candidate.Name);
                    // En cas d'erreur API, si on n'a pas de filtre de genre, on prend le film par défaut
                    if(genreId === 'all') { foundMovie = candidate; break; }
                }
            }

            // Fin de la recherche UI
            searchIndicator.classList.add('hidden');
            searchIndicator.classList.remove('flex');
            overlay.classList.add('hidden');

            if (!foundMovie) {
                grid.innerHTML = `
                    <div class="bg-red-900/40 border border-red-500/50 p-6 rounded-xl text-center max-w-sm w-full mt-4 animate-fade-in">
                        <i class="fa-solid fa-ghost text-4xl text-red-400 mb-3 opacity-80"></i>
                        <p class="text-red-200 text-sm">Aucun film de ce genre trouvé dans l'échantillon testé (parmi votre année sélectionnée).</p>
                        <p class="text-red-300 text-xs mt-2 italic">Essayez de relancer ou de changer vos filtres !</p>
                    </div>`;
                return;
            }

            currentMovieData = { ...foundMovie, synopsis: "Chargement..." }; 
            
            // Génération du Ticket
            const ticket = createTicket(foundMovie, 0);
            grid.appendChild(ticket);
            
            // Hydratation du ticket avec les données TMDB déjà trouvées (ou fallback)
            hydrateTicketData(foundMovie, foundTMDBData, 0);
        }

        function generateRandomBarcode() {
            let result = '';
            for (let i = 0; i < 12; i++) result += Math.floor(Math.random() * 10);
            return result;
        }

        function createTicket(movie, index) {
            const ticket = document.createElement('div');
            ticket.className = 'ticket printing group';
            
            const gradients = [ 
                'from-purple-800 to-blue-900', 
                'from-blue-800 to-slate-900', 
                'from-indigo-800 to-emerald-900',
                'from-slate-900 to-purple-900',
                'from-gray-800 to-orange-900'
            ];
            const grad = gradients[Math.floor(Math.random() * gradients.length)];
            const randomCode = generateRandomBarcode();

            ticket.innerHTML = `
                <div class="relative h-[65%] bg-gradient-to-br ${grad} overflow-hidden min-h-[400px]">
                    <img id="img-${index}" src="" crossorigin="anonymous" alt="Affiche" class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-700 z-10 shadow-[inset_0_-20px_50px_rgba(0,0,0,0.8)]">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent z-15"></div>
                    <div class="absolute inset-0 flex items-center justify-center p-6 text-center z-0">
                        <div><i class="fa-solid fa-film text-6xl text-white/10 mb-4 block"></i><h3 class="text-2xl font-bold text-white/40">${movie.Name}</h3></div>
                    </div>
                    <div class="absolute top-4 left-4 z-20">
                        <span class="px-3 py-1.5 bg-black/60 backdrop-blur-md text-xs font-bold uppercase tracking-wider rounded text-white border border-white/20 shadow-lg"><i class="fa-solid fa-ticket mr-2 text-green-400"></i>Sélection</span>
                    </div>
                </div>
                <div class="perforation"></div>
                <div class="h-[35%] bg-white p-8 flex flex-col justify-between relative pt-10">
                    <div>
                        <div class="flex justify-between items-start mb-3 gap-2">
                            <a href="${movie['Letterboxd URI']}" target="_blank" class="font-bold text-2xl leading-tight text-gray-900 line-clamp-2 hover:text-blue-600 transition-colors" title="Ouvrir sur Letterboxd">
                                ${movie.Name}
                            </a>
                            <span class="text-white font-mono text-base px-3 py-1 bg-[#14181c] rounded-lg whitespace-nowrap shadow-md">${movie.Year || 'N/A'}</span>
                        </div>
                        
                        <div class="relative min-h-[4rem] group/desc mt-2">
                            <p id="desc-${index}" class="text-sm text-gray-600 line-clamp-3 leading-relaxed cursor-help">
                                Préparation du résumé...
                            </p>
                            <div id="full-desc-${index}" class="hidden group-hover/desc:block absolute bottom-0 left-0 w-full bg-white/95 backdrop-blur-md p-4 shadow-xl border border-gray-200 rounded-lg z-50 max-h-[180px] overflow-y-auto text-sm text-gray-800 custom-scrollbar transform translate-y-2 transition-all">
                                Préparation...
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-center items-center mt-6 border-t border-gray-200 pt-5 opacity-80">
                        <div class="flex-shrink-0">
                            <div class="barcode text-black select-none tracking-widest text-2xl">${randomCode}</div>
                        </div>
                    </div>
                </div>
            `;
            return ticket;
        }

        function hydrateTicketData(movie, tmdbData, index) {
            if (tmdbData) {
                // On a déjà récupéré les données TMDB durant la phase de recherche !
                if (tmdbData.poster_path) {
                    const imageUrl = `https://image.tmdb.org/t/p/w500${tmdbData.poster_path}`;
                    const imgEl = document.getElementById(`img-${index}`);
                    if (imgEl) {
                        imgEl.src = imageUrl;
                        imgEl.onload = () => imgEl.classList.remove('opacity-0');
                    }
                }

                const overview = tmdbData.overview || "Résumé non disponible en français sur la base de données (TMDB).";
                const descEl = document.getElementById(`desc-${index}`);
                const fullDescEl = document.getElementById(`full-desc-${index}`);
                
                if (descEl) { descEl.textContent = overview; }
                if (fullDescEl) { fullDescEl.textContent = overview; }
                if (currentMovieData) currentMovieData.synopsis = overview;

            } else {
                // Fallback si TMDB n'a rien trouvé du tout lors de la recherche
                fetchMovieDataLegacy(movie["Letterboxd URI"], index);
            }
        }

        async function fetchMovieDataLegacy(url, index) {
            try {
                const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const res = await fetch(proxy);
                const data = await res.json();
                
                let imageUrl = null;
                const jsonLd = data.contents.match(/<script type="application\/ld\+json">\s*({.*?})\s*<\/script>/s);
                if (jsonLd) {
                    try { const meta = JSON.parse(jsonLd[1]); if (meta.image) imageUrl = meta.image; } catch(e){}
                }
                if (!imageUrl) {
                    const og = data.contents.match(/meta property="og:image" content="(.*?)"/);
                    if (og) imageUrl = og[1];
                }

                const imgEl = document.getElementById(`img-${index}`);
                if (imageUrl && imgEl) { imgEl.src = imageUrl; imgEl.onload = () => imgEl.classList.remove('opacity-0'); }

                let synopsis = "Synopsis indisponible.";
                const desc = data.contents.match(/meta property="og:description" content="(.*?)"/);
                if (desc) synopsis = desc[1].replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&#x27;/g, "'");
                
                const descEl = document.getElementById(`desc-${index}`);
                const fullDescEl = document.getElementById(`full-desc-${index}`);
                
                if (descEl) { descEl.textContent = synopsis; }
                if (fullDescEl) fullDescEl.textContent = synopsis;
                if (currentMovieData) currentMovieData.synopsis = synopsis;
                
            } catch { 
                 const d = document.getElementById(`desc-${index}`); if(d) d.textContent = "Info indisponible."; 
            }
        }
    </script>
</body>
