<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinémAzard V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600;700&family=Libre+Barcode+39+Text&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #14181c; /* Gris officiel de Letterboxd */
        }
        
        .cinema-title {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 0.1em;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        
        .barcode {
            font-family: 'Libre Barcode 39 Text', cursive;
            font-size: 32px;
            letter-spacing: 2px;
            transform: scaleY(1.2);
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #00E054; /* Vert officiel de Letterboxd */
            animation: spin 1s ease infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .glass-panel {
            background: rgba(44, 52, 64, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        /* --- STYLES TICKET & ANIMATION --- */
        .slot-machine-container {
            position: relative;
            overflow: hidden; 
            padding-top: 20px;
            padding-bottom: 120px; 
            width: 100%;
            display: flex;
            justify-content: center;
            min-height: 600px; 
        }

        .slot-opening {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 340px;
            height: 20px;
            background: linear-gradient(to bottom, #080a0c 0%, #14181c 100%);
            border-radius: 0 0 10px 10px;
            border-bottom: 2px solid #2c3440;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            z-index: 50; 
        }

        @keyframes printTicket {
            0% { transform: translateY(-120%); }
            100% { transform: translateY(0); }
        }

        .ticket {
            display: flex;
            flex-direction: column;
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 320px;
            transform: translateY(-120%);
            z-index: 10;
        }
        
        .ticket.printing {
            animation: printTicket 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .ticket::before, .ticket::after {
            content: ''; position: absolute; top: 66%; width: 26px; height: 26px;
            background-color: #14181c; 
            border-radius: 50%; z-index: 20;
        }
        .ticket::before { left: -13px; }
        .ticket::after { right: -13px; }
        
        .perforation {
            position: absolute; top: 66%; left: 10px; right: 10px;
            border-top: 3px dashed #cbd5e1;
            z-index: 10;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2399aabb%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 0.65em auto;
        }
        
        .animate-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body class="min-h-screen text-slate-100 selection:bg-green-500 selection:text-white">

    <div class="absolute top-4 right-4 z-50 flex items-center gap-3 bg-[#2c3440] p-2 pr-4 rounded-full border border-white/10 shadow-xl transition-all duration-300 hover:border-white/30">
        <div class="w-8 h-8 rounded-full bg-[#14181c] flex items-center justify-center overflow-hidden">
            <img src="https://letterboxd.com/favicon.ico" alt="Lbx" class="w-5 h-5">
        </div>
        <div class="flex flex-col">
            <span class="text-white text-xs font-bold leading-none mb-1" id="lbxUsernameDisplay">...</span>
            <span id="lbxWatchedCount" class="text-green-500 text-[10px] font-mono leading-none flex items-center gap-1">
                <i class="fa-solid fa-spinner fa-spin"></i>
            </span>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 pt-8 pb-32 min-h-screen flex flex-col items-center">
        
        <header class="flex flex-col items-center justify-center mb-8 mt-4 w-full">
            <div onclick="if(watchlist.length > 0) resetAndShowControls()" title="Retour au menu"
                 class="mb-4 rounded-full overflow-hidden w-24 h-24 shadow-lg shadow-black/50 border border-white/5 bg-[#14181c] cursor-pointer hover:scale-110 active:scale-95 transition-all duration-300 group">
                <img src="https://i.imgur.com/Cz0LzIT.png" alt="Logo CinémAzard" class="w-full h-full object-cover group-hover:brightness-110 transition-all">
            </div>
            
            <h1 class="cinema-title text-5xl md:text-7xl font-bold bg-clip-text text-transparent mb-2 text-center"
                style="background-image: linear-gradient(to right, #FF8000, #00E054, #40BCF4);">
                CinémAzard
            </h1>
            <p class="text-slate-400 text-sm text-center">Le hasard fait bien les films</p>
        </header>

        <div id="initLoader" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p id="loaderText" class="text-slate-400 text-sm animate-pulse">Chargement de la Watchlist...</p>
        </div>

        <div id="controlsArea" class="hidden glass-panel rounded-lg p-6 md:p-8 shadow-xl mb-10 max-w-lg w-full text-center transition-all duration-300 animate-fade-in">
            <div class="flex items-center justify-center gap-2 text-green-400 mb-6 text-xs font-small">
                <i class="fa-solid fa-check-circle"></i>
                <span id="movieCount">Liste chargée</span>
            </div>

            <div class="space-y-4 max-w-sm mx-auto">
                <div class="flex gap-2">
                    <div class="text-left bg-[#14181c] p-3 rounded-lg border border-white/5 flex-1 w-1/2">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-1">Année</label>
                        <select id="yearSelect" class="w-full bg-[#2c3440] border border-[#456] text-white text-sm rounded-md p-2 cursor-pointer hover:bg-[#343e4d] outline-none">
                            <option value="all">Toutes</option>
                        </select>
                    </div>
                    
                    <div class="text-left bg-[#14181c] p-3 rounded-lg border border-white/5 flex-1 w-1/2">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-1">Genre</label>
                        <select id="genreSelect" class="w-full bg-[#2c3440] border border-[#456] text-white text-sm rounded-md p-2 cursor-pointer hover:bg-[#343e4d] outline-none">
                            <option value="all">Tous</option>
                        </select>
                    </div>
                </div>
                
                <button onclick="pickRandomMovies()" id="classicBtn"
                    class="w-full bg-gradient-to-r from-green-600 to-green-500 hover:from-green-500 hover:to-green-400 text-white font-bold py-3 px-6 rounded-md transition-all flex items-center justify-center gap-2 shadow-lg shadow-green-900/30 transform hover:scale-105 active:scale-95 uppercase tracking-wide">
                    <span>Tirer un film au sort</span>
                    <i class="fa-solid fa-dice"></i>
                </button>
            </div>
        </div>
        
        <div id="errorMsg" class="hidden mt-4 p-4 bg-red-900/30 border border-red-500/50 rounded-lg text-red-200 text-center max-w-lg mx-auto"></div>

        <div id="resultsArea" class="hidden flex-grow flex flex-col items-center w-full">
            <div class="text-center mb-4 z-10 relative">
                <h2 class="text-xl font-bold text-green-500 mb-1">Ticket Sélectionné</h2>
                <p id="filterDisplay" class="text-xs text-slate-400 font-mono mb-4">Bonne séance à toi!</p>
            </div>

            <div class="w-full max-w-lg px-4 mb-4 animate-fade-in z-20 relative flex gap-2">
                <select id="resultYearSelect" onchange="syncAndPick()" class="flex-1 bg-[#2c3440] hover:bg-[#343e4d] border border-[#456] text-white text-xs rounded-xl py-2 px-3 appearance-none cursor-pointer outline-none">
                    <option value="all">Toutes Années</option>
                </select>
                <select id="resultGenreSelect" onchange="syncAndPick()" class="flex-1 bg-[#2c3440] hover:bg-[#343e4d] border border-[#456] text-white text-xs rounded-xl py-2 px-3 appearance-none cursor-pointer outline-none">
                    <option value="all">Tous Genres</option>
                </select>
                <button onclick="pickRandomMovies()" class="bg-green-500 hover:bg-green-400 text-white rounded-xl px-4 py-2 font-bold shadow-lg transition-transform active:scale-95">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <div id="searchLoader" class="hidden flex-col items-center justify-center py-10 z-20">
                <div class="loader mb-2"></div>
                <p class="text-green-400 text-xs font-mono animate-pulse">Recherche d'une correspondance...</p>
            </div>

            <div class="slot-machine-container" id="slotContainer">
                <div class="slot-opening"></div>
                <div id="movieGrid" class="flex justify-center w-full pt-4"></div>
            </div>
        </div>

        <footer class="mt-auto pt-10 pb-4 text-center text-slate-500 text-xs w-full">
            <p>CinémAzard V2 • Données via Letterboxd & TMDB</p>
        </footer>
    </div>

    <script>
        // === CONFIGURATION ===
        // Change ce pseudo par le tien. C'est lui qui ira chercher le compte !
        const DEFAULT_USERNAME = 'kryptonson'; 
        
        const CURRENT_YEAR = new Date().getFullYear();
        const TMDB_API_KEY = '91ff43ba698cce948e8dd82332a6ed99';
        const CSV_FILENAME = 'watchlist.csv'; 

        // === STATE ===
        let watchlist = [];
        let tmdbGenres = [];

        window.onload = async function() {
            // 1. Lancer la recherche des statistiques du profil Letterboxd
            fetchLetterboxdStats(DEFAULT_USERNAME);
            
            // 2. Charger les genres depuis TMDB
            await fetchTMDBGenres();

            // 3. Charger le fichier CSV
            autoLoadCSV();
        };

        // --- FETCH PROXY ROBUSTE ---
        // Utilise plusieurs proxys en cascade pour éviter les blocages (Failed to fetch)
        async function fetchWithProxy(targetUrl) {
            const proxies = [
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
                `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`
            ];

            for (let proxy of proxies) {
                try {
                    const response = await fetch(proxy);
                    if (response.ok) {
                        if (proxy.includes('allorigins')) {
                            const data = await response.json();
                            if (data.contents) return data.contents;
                        } else {
                            return await response.text();
                        }
                    }
                } catch (e) {
                    console.warn(`Proxy ${proxy} échoué. Essai du suivant...`);
                }
            }
            throw new Error("Tous les proxys ont échoué.");
        }

        // --- LETTERBOXD STATS ---
        async function fetchLetterboxdStats(username) {
            const displayEl = document.getElementById('lbxWatchedCount');
            const userDisplayEl = document.getElementById('lbxUsernameDisplay');
            
            userDisplayEl.textContent = username;
            displayEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const url = `https://letterboxd.com/${username}/`;
                const htmlContent = await fetchWithProxy(url);

                if (htmlContent) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlContent, "text/html");
                    
                    const filmsStat = doc.querySelector('.profile-stats a[href$="/films/"] .value') || 
                                      doc.querySelector('h4[data-stat="films"] .value');
                    
                    let count = "???";
                    if (filmsStat) {
                        count = filmsStat.textContent.trim();
                    } else {
                        const match = htmlContent.match(/href="\/[^/]+\/films\/".*?<span class="value">([\d,]+)<\/span>/i);
                        if (match) count = match[1];
                    }

                    displayEl.innerHTML = count !== "???" 
                        ? `<i class="fa-solid fa-eye text-green-500 mr-1"></i> ${count} films vus`
                        : `<i class="fa-solid fa-eye text-orange-400 mr-1"></i> Profil privé`;
                } else {
                    throw new Error("Contenu vide");
                }
            } catch (error) {
                console.error("Erreur Stats:", error);
                displayEl.innerHTML = `<i class="fa-solid fa-xmark text-red-500 mr-1"></i> Non trouvé`;
            }
        }

        // --- TMDB GENRES ---
        async function fetchTMDBGenres() {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/genre/movie/list?api_key=${TMDB_API_KEY}&language=fr-FR`);
                const data = await res.json();
                if(data.genres) {
                    tmdbGenres = data.genres;
                    populateGenreSelects();
                }
            } catch(e) {
                console.error("Impossible de charger les genres TMDB", e);
            }
        }

        function populateGenreSelects() {
            const selects = [document.getElementById('genreSelect'), document.getElementById('resultGenreSelect')];
            let options = '<option value="all">Tous</option>';
            // Trier les genres par ordre alphabétique
            tmdbGenres.sort((a,b) => a.name.localeCompare(b.name)).forEach(g => {
                options += `<option value="${g.id}">${g.name}</option>`;
            });
            selects.forEach(s => { if(s) s.innerHTML = options; });
        }

        // --- CSV PARSING ---
        async function autoLoadCSV() {
            const loader = document.getElementById('initLoader');
            const controls = document.getElementById('controlsArea');
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch(CSV_FILENAME);
                if (!response.ok) throw new Error(`Fichier introuvable.`);
                
                const text = await response.text();
                parseCSV(text);
                
                loader.classList.add('hidden');
                controls.classList.remove('hidden');
            } catch (error) {
                loader.classList.add('hidden');
                errorMsg.innerHTML = `
                    <div class="flex flex-col items-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation text-2xl text-red-400"></i>
                        <span class="font-bold">Impossible de lire <code>${CSV_FILENAME}</code></span>
                        <span class="text-xs">Lancez le fichier via un serveur local (Live Server).</span>
                    </div>
                `;
                errorMsg.classList.remove('hidden');
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            const startIndex = lines[0].toLowerCase().includes('date') ? 1 : 0;

            for(let i = startIndex; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const parts = lines[i].split(',');
                if (parts.length < 3) continue;

                const uri = parts[parts.length - 1]?.trim();
                const yearStr = parts[parts.length - 2]?.trim();
                let title = parts.slice(1, parts.length - 2).join(',').replace(/^"|"$/g, '').trim();

                if (uri && uri.includes('boxd.it')) {
                    result.push({ Name: title, Year: parseInt(yearStr), "Letterboxd URI": uri });
                }
            }
            
            if (result.length > 0) {
                watchlist = result;
                document.getElementById('movieCount').textContent = `${result.length} films prêts`;
                populateYearSelect(result);
            }
        }

        function populateYearSelect(movies) {
            const selects = [document.getElementById('yearSelect'), document.getElementById('resultYearSelect')];
            const htmlOptions = '<option value="all">Toutes</option>';
            const years = [...new Set(movies.map(m => m.Year))].filter(y => !isNaN(y) && y <= CURRENT_YEAR).sort((a, b) => b - a);
            
            let optionsStr = htmlOptions;
            years.forEach(year => optionsStr += `<option value="${year}">${year}</option>`);
            selects.forEach(s => { if(s) s.innerHTML = optionsStr; });
        }

        function resetAndShowControls() {
            document.getElementById('resultsArea').classList.add('hidden');
            document.getElementById('controlsArea').classList.remove('hidden');
            document.getElementById('movieGrid').innerHTML = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function syncAndPick() {
            // Synchronise les filtres entre le menu principal et la vue de résultats
            document.getElementById('yearSelect').value = document.getElementById('resultYearSelect').value;
            document.getElementById('genreSelect').value = document.getElementById('resultGenreSelect').value;
            pickRandomMovies();
        }

        // --- PICKER & TMDB GENRE CHECKING LOGIC ---
        async function checkMovieGenre(movie, targetGenreId) {
            // Vérifie silencieusement si un film spécifique possède le genre demandé via l'API TMDB
            try {
                let searchUrl = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(movie.Name)}&language=fr-FR`;
                if (movie.Year) searchUrl += `&year=${movie.Year}`;
                
                const res = await fetch(searchUrl);
                const data = await res.json();
                
                if (data.results && data.results.length > 0) {
                    const genres = data.results[0].genre_ids || [];
                    return genres.includes(parseInt(targetGenreId));
                }
                return false;
            } catch(e) { return false; }
        }

        async function pickRandomMovies() {
            const isResultView = !document.getElementById('resultsArea').classList.contains('hidden');
            const year = isResultView ? document.getElementById('resultYearSelect').value : document.getElementById('yearSelect').value;
            const genreId = isResultView ? document.getElementById('resultGenreSelect').value : document.getElementById('genreSelect').value;
            
            // Sync
            document.getElementById('resultYearSelect').value = year; document.getElementById('yearSelect').value = year;
            document.getElementById('resultGenreSelect').value = genreId; document.getElementById('genreSelect').value = genreId;

            // 1. Filtrage par année (instantané via CSV)
            let candidates = watchlist.filter(m => (!m.Year || m.Year <= CURRENT_YEAR));
            if (year !== 'all') candidates = candidates.filter(m => m.Year == year);

            if (candidates.length === 0) { 
                alert("Aucun film trouvé pour cette année."); return; 
            }

            // UI Switch to Loading
            document.getElementById('controlsArea').classList.add('hidden');
            document.getElementById('resultsArea').classList.remove('hidden');
            document.getElementById('slotContainer').classList.add('hidden');
            document.getElementById('searchLoader').classList.remove('hidden');
            document.getElementById('movieGrid').innerHTML = ''; // Clear previous ticket

            let finalMovie = null;

            // 2. Filtrage par Genre (Nécessite appels TMDB)
            if (genreId === 'all') {
                // Si pas de genre, on prend direct un au hasard
                finalMovie = candidates[Math.floor(Math.random() * candidates.length)];
            } else {
                // La Roulette ! On pioche et on vérifie jusqu'à trouver le bon genre
                // Limité à 15 essais pour ne pas bloquer l'API TMDB ou faire patienter trop longtemps.
                const shuffled = [...candidates].sort(() => 0.5 - Math.random());
                const maxTries = Math.min(15, shuffled.length); 
                
                for(let i = 0; i < maxTries; i++) {
                    const hasGenre = await checkMovieGenre(shuffled[i], genreId);
                    if (hasGenre) {
                        finalMovie = shuffled[i];
                        break;
                    }
                }
            }

            // Fin du chargement
            document.getElementById('searchLoader').classList.add('hidden');
            document.getElementById('slotContainer').classList.remove('hidden');

            if (finalMovie) {
                renderTicket(finalMovie);
            } else {
                alert(`Aucun film trouvé avec ce genre dans vos films de ${year === 'all' ? 'toutes les années' : year}.\nEssayez de relancer ou de changer de genre !`);
                resetAndShowControls();
            }
        }

        function renderTicket(movie) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            
            const gradients = ['from-purple-800 to-blue-900', 'from-blue-800 to-slate-900', 'from-indigo-800 to-purple-900', 'from-slate-900 to-purple-900'];
            const grad = gradients[Math.floor(Math.random() * gradients.length)];
            let barcode = ''; for(let i=0;i<12;i++) barcode += Math.floor(Math.random()*10);

            const ticket = document.createElement('div');
            ticket.className = 'ticket printing group';
            ticket.innerHTML = `
                <div class="relative h-[65%] bg-gradient-to-br ${grad} overflow-hidden min-h-[400px] group/poster">
                    <img id="img-target" src="" crossorigin="anonymous" alt="Affiche" class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-700 z-10">
                    <div class="absolute inset-0 flex items-center justify-center p-6 text-center z-0">
                        <div><i class="fa-solid fa-film text-6xl text-white/10 mb-4 block"></i><h3 class="text-2xl font-bold text-white/40">${movie.Name}</h3></div>
                    </div>
                    <div class="absolute top-4 left-4 z-20">
                        <span class="px-3 py-1.5 bg-black/60 backdrop-blur-md text-xs font-bold uppercase tracking-wider rounded text-white border border-white/20 shadow-lg">Salle 42</span>
                    </div>
                </div>
                <div class="perforation"></div>
                <div class="h-auto flex-1 bg-white p-8 flex flex-col justify-between relative pt-10 rounded-b-2xl">
                    <div>
                        <div class="flex justify-between items-start mb-3 gap-2">
                            <a href="${movie['Letterboxd URI']}" target="_blank" class="font-bold text-2xl leading-tight text-gray-900 line-clamp-2 hover:text-purple-600 transition-colors" title="Voir sur Letterboxd">
                                ${movie.Name}
                            </a>
                            <div class="flex items-center gap-2 flex-shrink-0">
                                <span class="text-white font-mono text-base px-3 py-1 bg-black rounded-lg whitespace-nowrap shadow-md">${movie.Year || 'N/A'}</span>
                            </div>
                        </div>
                        
                        <div class="relative min-h-[4rem] group/desc">
                            <p id="desc-target" class="text-sm text-gray-600 line-clamp-3 leading-relaxed cursor-help">
                                Chargement des infos TMDB...
                            </p>
                            <div id="full-desc-target" class="hidden group-hover/desc:block absolute bottom-0 left-0 w-full bg-white/95 backdrop-blur-md p-4 shadow-xl border border-gray-200 rounded-lg z-50 max-h-[180px] overflow-y-auto text-sm text-gray-800 custom-scrollbar transform translate-y-2 transition-all">
                                Chargement...
                            </div>
                        </div>
                        
                        <!-- Zone pour les icônes de streaming -->
                        <div id="providers-container" class="mt-4 flex flex-wrap items-center gap-2 min-h-[24px]">
                            <span class="text-xs text-gray-400 italic animate-pulse">Recherche des plateformes...</span>
                        </div>
                    </div>
                    <div class="flex justify-center items-center mt-6 border-t border-gray-200 pt-5">
                        <div class="flex-shrink-0">
                            <div class="barcode text-black select-none tracking-widest text-2xl">${barcode}</div>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(ticket);
            fetchFinalMovieData(movie);
        }

        async function fetchFinalMovieData(movie) {
            try {
                let searchUrl = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(movie.Name)}&language=fr-FR`;
                if (movie.Year) searchUrl += `&year=${movie.Year}`;

                const response = await fetch(searchUrl);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    const bestMatch = data.results[0]; 
                    if (bestMatch.poster_path) {
                        const imgEl = document.getElementById('img-target');
                        if (imgEl) {
                            imgEl.src = `https://image.tmdb.org/t/p/w500${bestMatch.poster_path}`;
                            imgEl.onload = () => imgEl.classList.remove('opacity-0');
                        }
                    }

                    const overview = bestMatch.overview || "Résumé non disponible en français.";
                    const descEl = document.getElementById('desc-target');
                    const fullDescEl = document.getElementById('full-desc-target');
                    if (descEl) descEl.textContent = overview; 
                    if (fullDescEl) fullDescEl.textContent = overview; 
                    
                    // Récupération des offres de streaming
                    fetchMovieProviders(bestMatch.id);

                } else {
                    document.getElementById('providers-container').innerHTML = '';
                    fetchMovieDataLegacy(movie["Letterboxd URI"]);
                }
            } catch (error) {
                document.getElementById('providers-container').innerHTML = '';
                fetchMovieDataLegacy(movie["Letterboxd URI"]);
            }
        }

        async function fetchMovieProviders(movieId) {
            const container = document.getElementById('providers-container');
            if (!container) return;

            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${movieId}/watch/providers?api_key=${TMDB_API_KEY}`);
                const data = await res.json();

                // On vérifie s'il y a des résultats pour la France (FR) et en abonnement (flatrate)
                if (data.results && data.results.FR && data.results.FR.flatrate) {
                    const providers = data.results.FR.flatrate;
                    let html = '<span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide mr-1"><i class="fa-solid fa-tv mr-1"></i>Stream :</span>';
                    
                    providers.forEach(p => {
                        html += `<img src="https://image.tmdb.org/t/p/w45${p.logo_path}" alt="${p.provider_name}" title="Disponible sur ${p.provider_name}" class="w-6 h-6 rounded-md shadow-sm border border-gray-200 hover:scale-110 transition-transform cursor-help">`;
                    });
                    
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<span class="text-xs text-gray-400 italic">Aucune plateforme de streaming (FR) trouvée.</span>';
                }
            } catch (e) {
                container.innerHTML = '';
                console.error("Erreur providers:", e);
            }
        }

        async function fetchMovieDataLegacy(url) {
            try {
                const htmlContent = await fetchWithProxy(url);
                
                let imageUrl = null;
                const jsonLd = htmlContent.match(/<script type="application\/ld\+json">\s*({.*?})\s*<\/script>/s);
                if (jsonLd) { try { const meta = JSON.parse(jsonLd[1]); if (meta.image) imageUrl = meta.image; } catch(e){} }
                if (!imageUrl) { const og = htmlContent.match(/meta property="og:image" content="(.*?)"/); if (og) imageUrl = og[1]; }

                const imgEl = document.getElementById('img-target');
                if (imageUrl && imgEl) { imgEl.src = imageUrl; imgEl.onload = () => imgEl.classList.remove('opacity-0'); }

                let synopsis = "Synopsis indisponible.";
                const desc = htmlContent.match(/meta property="og:description" content="(.*?)"/);
                if (desc) synopsis = desc[1].replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&#x27;/g, "'");
                
                const descEl = document.getElementById('desc-target');
                const fullDescEl = document.getElementById('full-desc-target');
                if (descEl) descEl.textContent = synopsis;
                if (fullDescEl) fullDescEl.textContent = synopsis;
                
            } catch { 
                 const d = document.getElementById('desc-target'); if(d) d.textContent = "Info indisponible."; 
            }
        }
    </script>
